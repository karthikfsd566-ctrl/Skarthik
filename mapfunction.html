<!DOCTYPE html>
<html>
    <body>
        <h1> Javascript Maps</h1>
        <h2> The new map() methods </h2>

        <p>Creating a map from an array: </p>
        <p id="demo"></p>

        <script>
            //Create a map
            const fruits = new Map([
                ["apples" , 500],
                ["bananas" , 300],
                ["Oranges" , 200]
            ]);
            let numb = fruits.get("apples");
            document.getElementById("demo").innerHTML = "there are " + numb + " apples.";
        </script>
    </body>
</html>
